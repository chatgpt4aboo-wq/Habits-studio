<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habits Studio — design the days that design you</title>
    <meta
      name="description"
      content="Habits Studio is a calm practice studio: design a handful of habits, mark them daily, and watch the grid fill in. No streak guilt, no noise."
    />
    <meta name="author" content="Habits Studio" />
    <meta name="theme-color" content="#F8F6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:title" content="Habits Studio" />
    <meta property="og:description" content="Design the days that design you." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.svg" />

    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem("habits-studio:theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
